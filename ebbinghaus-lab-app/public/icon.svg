<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" fill="#080C14"/>
  
  <!-- 破線を背面（前）に配置し、曲線のY座標（360, 270）に正確に合わせる -->
  <path d="M250 360 L 250 100" stroke="#10B981" stroke-width="10" stroke-dasharray="20 20"/>
  <path d="M380 270 L 380 100" stroke="#EC4899" stroke-width="10" stroke-dasharray="20 20"/>

  <!-- シアンの曲線 -->
  <path d="M100 100 Q 200 400 412 450" fill="none" stroke="#06B6D4" stroke-width="40" stroke-linecap="round"/>
  
  <!-- 緑の点と曲線 -->
  <circle cx="250" cy="100" r="25" fill="#10B981"/>
  <path d="M250 100 Q 350 250 412 300" fill="none" stroke="#10B981" stroke-width="40" stroke-linecap="round"/>
  
  <!-- ピンクの点と曲線 -->
  <circle cx="380" cy="100" r="25" fill="#EC4899"/>
  <path d="M380 100 Q 450 120 480 150" fill="none" stroke="#EC4899" stroke-width="40" stroke-linecap="round"/>
</svg>
