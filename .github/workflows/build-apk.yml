name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Install Dependencies
        run: |
          npm install

      - name: Build Web Assets
        run: |
          npm run build

      - name: Initialize & Sync Capacitor Android
        run: |
          if [ ! -d "android" ]; then
            npx @capacitor/cli add android
          fi
          npx @capacitor/cli sync android

      - name: Generate Custom App Icons and Splash Screen
        run: |
          pip install pillow
          python3 scripts/generate-icons.py

      - name: Configure Android SDK and Permissions
        run: |
          if [ -f "android/variables.gradle" ]; then
            sed -i 's/minSdkVersion = [0-9]*/minSdkVersion = 26/g' android/variables.gradle
          fi

          MANIFEST_FILE="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST_FILE" ]; then
            if ! grep -q "POST_NOTIFICATIONS" "$MANIFEST_FILE"; then
              sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" \/>\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" \/>\n    <uses-permission android:name="android.permission.USE_EXACT_ALARM" \/>\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" \/>\n    <uses-permission android:name="android.permission.VIBRATE" \/>' "$MANIFEST_FILE"
            fi
          fi

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ebbinghaus-lab-app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
